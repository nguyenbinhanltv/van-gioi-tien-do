<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="920" viewBox="0 0 1440 920" role="img" aria-labelledby="title desc">
<title id="title">Chuẩn tỉ lệ semi-chibi cho bốn Đạo Lộ</title><desc id="desc">Cùng chiều cao đứng H. Đầu và khối tóc chính22%H, dải cho phép20–24%. Đường mắt15–17%H tính từ đỉnh đầu. Vai Kiếm26–30%,Thể30–34%,Pháp và Đan24–28%H. Hình dựng sơ đồ,không thay mặt hoặc concept.</desc>
<rect width="1440" height="920" fill="#f6f2e8"/><text x="60" y="55" font-family="sans-serif" font-size="16" fill="#52636b">VẠN GIỚI TIÊN ĐỒ · D44 · HƯỚNG DỰNG MASTER</text><text x="60" y="100" font-family="sans-serif" font-size="34" fill="#213544">Một tỉ lệ chung — bốn silhouette riêng</text>
<text x="60" y="133" font-family="sans-serif" font-size="17" fill="#52636b">Sơ đồ cấu trúc, không phải tranh nhân vật. Cùng H danh định; không đo theo đuôi tóc, vũ khí, giáp hoặc VFX.</text>
<g font-family="sans-serif" font-size="15" fill="#52636b">
<text x="48" y="205">Đỉnh = 0%</text><text x="48" y="269">Mắt 15–17%</text><text x="48" y="300">Đầu 20–24%</text><text x="48" y="345">Vai giải phẫu</text><text x="48" y="407">Hông ~50%</text><text x="48" y="605">Đế = 100%</text>
</g>
