<rect x="60" y="705" width="1320" height="165" rx="10" fill="#e9e2d3"/><g font-family="sans-serif" fill="#344c59" font-size="17">
<text x="85" y="738">H = chiều cao từ đỉnh khối tóc chính đến đế chân; cùng H danh định, dải dựng 98–102% của H.</text>
<text x="85" y="769">Đầu + tóc chính: mục tiêu 22% H, cho phép 20–24%. Mắt: 15–17% H dưới đỉnh (giữ mặt master).</text>
<text x="85" y="800">H và đầu đều bỏ búi cao / topknot / đuôi tóc / trang trí. Vai bỏ giáp và tay áo; VFX / vũ khí ở ngoài H.</text>
<text x="85" y="831">Tỉ lệ là chuẩn dựng mỹ thuật; pixel đích theo hợp đồng tooling chung. Giữ một tỉ lệ toàn cục, không kéo giãn từng frame.</text>
</g></svg>
