name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 22]
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # --if-present: workspaces without the script (e.g. placeholders) are skipped
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run lint
      - run: npm run docs:links
      # P5 load smoke (docs/35): 20 gameplay bots (real NetClient) on the real gateway + world node + file store for 60 s; the gate fails on
      # correctness (bots dropped, kicks, protocol violations, nobody playing) and gross tick overruns only, never on the design budgets or on cooldown violations (docs/35 §3.2)
      - run: npm run soak -w @vgtd/server -- --ci
        timeout-minutes: 5
