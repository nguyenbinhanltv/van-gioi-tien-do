name: Assets

# Short, deterministic asset check: generate -> validate -> pack -> budget gate.
# No AI steps, no deploy. KTX2/ASTC compression is skipped when basisu/astcenc are absent (not installed here).
on:
  push:
    branches: [main]
    paths:
      - 'tools/procgen/**'
      - 'assets-src/gemini/**'
      - 'apps/client-cocos/assets/resources/dragonbones/**'
      - 'packages/shared/src/constants.ts'
      - '.github/workflows/assets.yml'
  pull_request:
    paths:
      - 'tools/procgen/**'
      - 'assets-src/gemini/**'
      - 'apps/client-cocos/assets/resources/dragonbones/**'
      - 'packages/shared/src/constants.ts'
      - '.github/workflows/assets.yml'

concurrency:
  group: assets-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  assets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true # assets-src/gemini source PNGs
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run gen:tilemap -w @vgtd/procgen
      - run: npm run gen:items -w @vgtd/procgen
      # Owner-provided Gemini props / icons: key + sparkle removal + trim + atlases (fails if the corner mark is not found / still there).
      - run: npm run gen:gemini -w @vgtd/procgen
      # SVG -> PNG (resvg). glslangValidator / Xvfb are absent, so shader compile + snapshots are skipped with a notice.
      - run: npm run render -w @vgtd/procgen
      - run: npm run validate -w @vgtd/procgen
      - run: npm run pack -w @vgtd/procgen
      # Skips gracefully (exit 0, compress_manifest.json skipped:true) when basisu / cwebp are missing.
      - run: npm run compress:web -w @vgtd/procgen
      # Also plans the chibi runtime bundles from the committed exports (D71): loco/bundle/class GPU budgets per tier.
      # Fails (exit 20) on: atlas not power of two or over cap, missing padding/extrude, icon sizes, initial package > 25 MB.
      # Prints the budget report to the job summary.
      - run: npm run budget -w @vgtd/procgen
